name: 功能請求 (Feature Request)
description: 建議新的演算法、資料結構或其他功能。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述 (Feature Description)
      description: "請詳細描述您希望新增的功能。"
    validations:
      required: true
  - type: textarea
    id: problem-to-solve
    attributes:
      label: 這個功能解決了什麼問題？ (What problem does this feature solve?)
      description: "請說明為什麼需要這個功能，以及它可以解決什麼樣的競程問題。"
  - type: textarea
    id: references
    attributes:
      label: 相關參考 (References)
      description: "請提供相關的論文、教學文章或程式碼連結。"